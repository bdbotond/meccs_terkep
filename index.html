<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magyar Foci Meccstérkép</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-container">
    <header id="control-bar">
      <div class="brand">
        <span class="brand-icon">⚽</span>
        <h1>Magyar Meccstérkép</h1>
      </div>

      <div class="filter-group">
        <label for="league-select">Bajnokság:</label>
        <div class="select-wrapper">
          <input type="text" id="league-search" placeholder="Bajnokság keresése..." autocomplete="off">
          <select id="league-select">
            <option value="ALL">Összes bajnokság</option>
          </select>
        </div>
      </div>

      <div class="filter-group">
        <label for="date-from">Kezdő dátum:</label>
        <input type="date" id="date-from">
      </div>

      <div class="filter-group">
        <label for="date-to">Záró dátum:</label>
        <input type="date" id="date-to">
      </div>

      <div class="action-group">
        <button id="reset-filters-btn" title="Szűrők visszaállítása">Visszaállítás</button>
        <div class="match-badge">
          <span id="match-count">0</span> meccs
        </div>
      </div>
    </header>

    <main id="map-container">
      <div id="map"></div>
      <div id="loading-overlay" class="active">
        <div class="spinner"></div>
        <p>Meccsadatok betöltése...</p>
      </div>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Preloaded Data (works on file://, http://, and offline) -->
  <script src="data/dataset.js"></script>
  <!-- App JS -->
  <script src="js/app.js"></script>
</body>
</html>

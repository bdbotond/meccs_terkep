name: Update Match Schedule

on:
  schedule:
    # Run every Monday at 03:00 UTC (04:00/05:00 Budapest time)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    # Allows manual trigger at any time

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MLSZ Scraper
        run: |
          python scripts/scraper.py --full

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No schedule or venue updates detected. Database is up to date."
          else
            git commit -m "Auto-update match schedule and venues [skip ci]"
            git push
            echo "Successfully updated and pushed match database."
          fi

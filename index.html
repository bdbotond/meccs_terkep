<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magyar Foci Meccstérkép</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-container">
    <header id="control-bar">
      <div class="brand">
        <span class="brand-icon">⚽</span>
        <h1>Magyar Meccstérkép</h1>
      </div>

      <div class="filter-group">
        <label for="global-search">Keresés:</label>
        <input type="text" id="global-search" placeholder="Csapat, stadion, város..." autocomplete="off">
      </div>

      <div class="filter-group">
        <label for="level-select">Szint:</label>
        <select id="level-select">
          <option value="ALL">Összes szint</option>
          <option value="NB I">NB I</option>
          <option value="NB II">NB II</option>
          <option value="NB III">NB III</option>
          <option value="Megye I">Megye I / BLSZ I</option>
          <option value="Megye II">Megye II / BLSZ II</option>
          <option value="Megye III">Megye III / BLSZ III</option>
          <option value="Megye IV">Megye IV / BLSZ IV</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="league-select">Bajnokság:</label>
        <select id="league-select">
          <option value="ALL">Összes bajnokság</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="date-from">Kezdő dátum:</label>
        <input type="date" id="date-from">
      </div>

      <div class="filter-group">
        <label for="date-to">Záró dátum:</label>
        <input type="date" id="date-to">
      </div>

      <div class="filter-group date-presets-group">
        <button type="button" class="preset-btn" data-preset="today" title="Mai mérkőzések">Ma</button>
        <button type="button" class="preset-btn" data-preset="weekend" title="Hétvégi mérkőzések">Hétvége</button>
        <button type="button" class="preset-btn" data-preset="week" title="Következő 7 nap">7 nap</button>
        <button type="button" class="preset-btn" data-preset="all" title="Teljes szezon">Összes</button>
      </div>

      <div class="filter-group">
        <label for="time-select">Kezdés:</label>
        <select id="time-select">
          <option value="ALL">Egész nap</option>
          <option value="morning">Délelőtt (&lt; 12:00)</option>
          <option value="afternoon">Délután (12:00 - 17:00)</option>
          <option value="evening">Este (&gt; 17:00)</option>
        </select>
      </div>

      <div class="action-group">
        <button id="reset-filters-btn" title="Szűrők visszaállítása">Visszaállítás</button>
        <div class="match-badge">
          <span id="match-count">0</span> meccs
        </div>
        <a href="https://buymeacoffee.com/bdbotond" target="_blank" rel="noopener noreferrer" class="bmac-badge" title="Buy Me a Coffee">
          <img src="https://img.shields.io/badge/Buy%20Me%20a%20Coffee-ffdd00?style=for-the-badge&logo=buy-me-a-coffee&logoColor=black" alt="Buy Me a Coffee">
        </a>
      </div>
    </header>

    <main id="map-container">
      <div id="map"></div>
      <div id="loading-overlay" class="active">
        <div class="spinner"></div>
        <p>Meccsadatok betöltése...</p>
      </div>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Preloaded Data & Static Offline Map (works on file://, http://, offline, no API key) -->
  <script src="data/hungary_map.js"></script>
  <script src="data/dataset.js"></script>
  <!-- App JS -->
  <script src="js/app.js"></script>
</body>
</html>
